name: ci
on: [push, pull_request]
jobs:
  frontend-e-paridade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci --ignore-scripts
      - run: node tools/build.mjs --html-ocr
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python3 tools/verificar.py            # every suite; fails if any fails
      - uses: actions/upload-artifact@v4
        with: { name: comerhoje-html, path: inst/standalone/comerhoje.html }
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts && node tools/build.mjs
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.6" }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: "any::testthat, any::rcmdcheck, any::roxygen2, any::pkgload" }
      - run: Rscript -e 'roxygen2::roxygenise()'          # man/ and NAMESPACE from the roxygen comments
      - run: Rscript -e 'pkgload::load_all(); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
      # R CMD check on the built tarball (.Rbuildignore applies). Expected: 0 errors, 0 warnings, 1 NOTE
      # (installed size: the on-device reader's OCR models in inst/app/www/ocr, ~30 MB).
      - uses: r-lib/actions/check-r-package@v2
        with: { args: 'c("--no-manual")', error-on: '"warning"', check-dir: '"check"' }
